<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0c1626" />

    <!-- Open Graph -->
    <meta property="og:type" content="product" />
    <meta property="og:title" content="Orteva Knee Compression Sleeve" />
    <meta
      property="og:description"
      content="Targeted knee support with a gel stabilizer ring. Free worldwide shipping, free returns, 30-day comfort-fit guarantee."

    <!-- Hero image preload for fast LCP -->

      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1556817411-31ae72fa3ea0?auto=format&fit=crop&w=900&q=70"
    />

    <!-- Claim-safe product structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Orteva Knee Compression Sleeve",
        "description": "A knee-specific compression sleeve with an anatomical gel stabilizer ring and dual non-slip grip bands for targeted support and all-day comfort.",
        "brand": { "@type": "Brand", "name": "Orteva" },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "reviewCount": "3000"
        },
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "34.99",
          "highPrice": "74.99",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
